<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visitor Management</title>

<link rel="stylesheet" href="css/visitor.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<h1>
<i class="fa-solid fa-user-check"></i>
Visitor Management
</h1>

<div class="form">

<input
type="text"
id="visitorName"
placeholder="Visitor Name">

<input
type="text"
id="studentName"
placeholder="Student Name">

<input
type="text"
id="relation"
placeholder="Relation (Father, Mother, Friend)">

<input
type="text"
id="phone"
placeholder="Phone Number">

<input
type="date"
id="date">

<input
type="time"
id="time">

<button onclick="generateVisitorPass()">
Generate Visitor Pass
</button>

</div>

<div id="visitorCard" class="visitor-card">

<h2>Visitor Pass</h2>

<img
id="qrImage"
src=""
alt="QR Code">

<p><b>Visitor :</b> <span id="vName"></span></p>

<p><b>Student :</b> <span id="sName"></span></p>

<p><b>Relation :</b> <span id="vRelation"></span></p>

<p><b>Date :</b> <span id="vDate"></span></p>

<p><b>Time :</b> <span id="vTime"></span></p>

<p class="approved">
Approved ✅
</p>

</div>

</div>

<script src="js/visitor.js"></script>

</body>

</html>
