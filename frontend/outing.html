<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostelHub AI | Outing Request</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:450px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.3);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            color:#1e293b;
        }

        label{
            font-weight:bold;
            display:block;
            margin-top:15px;
        }

        input,
        textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        textarea{
            resize:none;
            height:90px;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1d4ed8;
        }

        #message{
            margin-top:20px;
            text-align:center;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="container">

<h1>Outing Request</h1>

<input id="studentName" type="text" placeholder="Student Name">

<input id="registrationNumber" type="text" placeholder="Registration Number">

<input id="destination" type="text" placeholder="Destination">

<textarea id="reason" placeholder="Reason"></textarea>

<label>Out Time</label>
<input id="outTime" type="time">

<label>Return Time</label>
<input id="returnTime" type="time">

<input id="emergencyContact" type="text" placeholder="Emergency Contact">

<button onclick="submitOuting()">

Submit Request

</button>

<p id="message"></p>

</div>

<script src="js/outing.js"></script>

</body>

</html>
